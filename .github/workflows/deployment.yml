name: Deployment Project
on: push
jobs:
    test:
        run-on: ubuntu-latest

        steps:
            - name: Get Code
              uses: actions/checkout@v5
            - name: install NodeJS
              uses: actions/setup-node@v5
              with:
                node-version: 20
            
                - name: install dependencies
                  run: npm ci

                - name: Run test
                  run: npm test

    

